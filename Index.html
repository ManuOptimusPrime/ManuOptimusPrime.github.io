<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.04);
      border-color: #38bdf8;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .handle {
      color: #38bdf8;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .bio {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: #0284c7;
      border: none;
    }

    .btn-primary:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="avatar-wrapper">
      <!-- Change 'avatar.jpg' to your image file or URL -->
      <img 
        src="avatar.jpg" 
        alt="Profile Picture" 
        class="avatar"
        onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80'"
      />
    </div>

    <h1>Your Name</h1>
    <p class="handle">@username</p>
    <p class="bio">Digital creator, developer, or photographer. Welcome to my personal page!</p>

    <div class="links">
      <a href="avatar.jpg" target="_blank" class="btn btn-primary" download>View / Download Avatar</a>
      <a href="https://twitter.com" target="_blank" rel="noopener" class="btn">Twitter / X</a>
      <a href="https://github.com" target="_blank" rel="noopener" class="btn">GitHub</a>
      <a href="mailto:you@example.com" class="btn">Contact Me</a>
    </div>
  </main>

</body>
</html>
