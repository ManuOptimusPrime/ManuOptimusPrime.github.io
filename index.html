<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Picture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 24px;
    }

    .container {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .image-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .profile-img:hover {
      transform: scale(1.03);
      border-color: #38bdf8;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-download {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .btn-download:hover {
      background: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
    }

    .btn-view {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-view:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="image-wrapper">
      <img 
        id="profilePic"
        src="IMG_1440.jpg" 
        alt="Profile Picture" 
        class="profile-img"
        onerror="handleImageError(this)"
      />
    </div>

    <h1>My Profile Picture</h1>
    <p>View or download the full resolution photo below.</p>

    <div class="actions">
      <a href="IMG_1440.jpg" download="IMG_1440.jpg" class="btn btn-download">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        Download Photo
      </a>

      <a href="IMG_1440.jpg" target="_blank" rel="noopener noreferrer" class="btn btn-view">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        </svg>
        View Full Size
      </a>
    </div>
  </main>

  <script>
    function handleImageError(img) {
      if (img.src.endsWith('IMG_1440.jpg')) {
        img.src = 'IMG_1440.JPG';
      }
    }
  </script>

</body>
</html>
